services:
  - type: web
    name: fivem-arts-bot
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: DISCORD_TOKEN
        sync: false
      - key: CLIENT_ID
        sync: false
      - key: GUILD_ID
        sync: false
      - key: OWNER_ID
        sync: false
      - key: STAFF_ROLE_ID
        sync: false
      - key: MP_ACCESS_TOKEN
        sync: false
